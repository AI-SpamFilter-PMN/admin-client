# HTTP port the embedded Tomcat listens on
server.port=8082

# Neon (Postgres) connection string - shared with sms-client/the SMPP server.
# Never put the real value here; set it via -Ddb.url=... or the DB_URL
# environment variable at launch instead.
db.url=

# Admin login uses the shared users table (see sms-client's account system) -
# an account needs role = ROLE_ADMIN or ROLE_ESCALATION to sign in here.
# There's no separate admin account to configure.
